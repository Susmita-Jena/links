.veil{position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
   repeating-linear-gradient(0deg,rgba(14,7,20,.18) 0 4px,transparent 4px 8px),
   linear-gradient(180deg,rgba(29,17,38,.55),rgba(42,23,54,.86) 70%,rgba(29,17,38,.94))}
.stars{position:fixed; inset:0; pointer-events:none; z-index:0}
.star{position:absolute; background:var(--pink); animation:tw 2.4s steps(2) infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
/* roses */
.rose{position:fixed; z-index:0; pointer-events:none; width:84px; height:84px; opacity:.88; filter:saturate(.8) drop-shadow(4px 4px 0 var(--shadow)); image-rendering:pixelated; animation:sway 3.2s steps(2) infinite}
.r1{top:-14px; left:-12px; transform:rotate(-18deg)}
.r2{top:10%; right:-20px; width:76px; height:76px; transform:rotate(24deg); animation-delay:.8s}
.r3{bottom:-24px; left:-20px; width:104px; height:104px; transform:rotate(12deg); animation-delay:1.2s}
.r4{bottom:4%; right:-20px; transform:rotate(-26deg); animation-delay:.4s}
.r5{top:48%; left:-30px; width:60px; height:60px; transform:rotate(30deg); animation-delay:1.6s}
.r8{top:30%; right:-10px; width:52px; height:52px; transform:rotate(-40deg); animation-delay:1.9s}
@keyframes sway{50%{translate:0 -6px}}
main{position:relative; z-index:1; width:100%; max-width:460px; padding:40px 20px 48px; text-align:center}
.avatar{display:block; margin:0 auto 20px; width:150px; height:150px; image-rendering:pixelated; border:4px solid var(--coral); box-shadow:6px 6px 0 var(--shadow); animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-family:'Press Start 2P',monospace; font-size:20px; line-height:1.5; margin:0 0 10px; color:var(--coral); text-shadow:3px 3px 0 var(--shadow)}
.tag{margin:0; color:var(--violet); font-size:26px; text-shadow:2px 2px 0 var(--shadow)}
.bio{margin:8px 0 28px; color:var(--pink); text-shadow:2px 2px 0 var(--shadow)}
.links{display:flex; flex-direction:column; gap:16px}
.btn{
  display:flex; align-items:center; gap:14px;
  padding:10px 16px 10px 10px; color:var(--ink); text-decoration:none;
  background:var(--card); border:4px solid var(--violet);
  box-shadow:6px 6px 0 var(--shadow);
  font-family:'Press Start 2P',monospace; font-size:12px; text-align:left;
}
.btn .t{flex:1; min-width:0}
.btn small{font-family:'VT323',monospace; font-size:20px; color:var(--dim); display:block; margin-top:6px}
.ico{flex:none; width:56px; height:56px; background:#fff; border:3px solid var(--shadow); image-rendering:pixelated; object-fit:cover}
button.btn{width:100%; cursor:pointer; margin:0; -webkit-appearance:none; appearance:none}
dialog{border:4px solid var(--coral); background:var(--card); color:var(--ink); box-shadow:8px 8px 0 var(--shadow); padding:22px 20px 16px; max-width:min(380px,88vw); text-align:center; font-family:'VT323',monospace; font-size:22px}
dialog::backdrop{background:rgba(14,7,20,.78)}
dialog h2{font-family:'Press Start 2P',monospace; font-size:14px; color:var(--coral); margin:0 0 14px}
.em{margin:0 0 16px; color:var(--pink); font-size:26px; word-break:break-all}
.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.row button,.row a{font-family:'Press Start 2P',monospace; font-size:10px; color:var(--ink); background:#4a2a5a; border:3px solid var(--violet); box-shadow:4px 4px 0 var(--shadow); padding:10px 12px; text-decoration:none; cursor:pointer}
.row button:hover,.row a:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--shadow)}
.ok{height:24px; margin:12px 0 0; color:var(--violet)}
.x{background:none; border:0; color:var(--dim); font-family:'VT323',monospace; font-size:20px; cursor:pointer}
.btn:nth-child(even){border-color:var(--coral)}
.btn:hover,.btn:focus-visible{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--shadow); background:#4a2a5a; outline:none}
.btn:active{transform:translate(6px,6px); box-shadow:0 0 0 var(--shadow)}
.arrow{color:var(--coral); font-size:14px; flex:none}
footer{margin-top:34px; color:var(--dim); font-size:20px; text-shadow:2px 2px 0 var(--shadow)}
.bar{height:12px; margin:26px auto 0; width:70%; background:repeating-linear-gradient(90deg,var(--coral) 0 12px,transparent 12px 24px); opacity:.8}
@media (prefers-reduced-motion:reduce){.avatar,.star,.rose{animation:none}}
</style>
</head>
